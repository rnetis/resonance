<meta name="apple-mobile-web-app-capable" content="yes">

</head>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="i"><use href="#i-music"/></svg></span>
      <span class="brand-text">Resonance</span>
    </div>
    <div class="topbar-actions">
      <span class="pill offline-pill" id="netBadge" hidden><svg class="i"><use href="#i-offline"/></svg>Offline</span>
      <button class="btn ghost small" id="installBtn" hidden><svg class="i"><use href="#i-install"/></svg>Install</button>
      <button class="icon-btn" id="nativeSettingsBtn" hidden title="Server settings"><svg class="i"><use href="#i-settings"/></svg></button>
      <button class="icon-btn" id="refreshBtn" title="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
    </div>
  </header>

  <main id="views">
    <!-- Search -->
    <section class="view" id="view-search">
      <form class="search-form" id="searchForm" role="search">
        <svg class="i search-icon"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" name="q" placeholder="Search YouTube for songs…" autocomplete="off" enterkeyhint="search" aria-label="Search YouTube">
        <button class="btn primary" type="submit">Search</button>
      </form>
      <div class="chips" id="searchChips"></div>
      <div class="status" id="searchStatus" hidden></div>
      <ul class="list" id="searchResults"></ul>
    </section>

    <!-- Library -->
    <section class="view" id="view-library" hidden>
      <div class="lib-toolbar">
        <div class="crumbs" id="libCrumbs"></div>
        <button class="btn ghost small" id="recursiveBtn" aria-pressed="false">All songs</button>
      </div>
      <div class="lib-actions">
        <button class="btn soft small" id="playAllBtn"><svg class="i"><use href="#i-play"/></svg>Play all</button>
        <button class="btn soft small" id="shuffleAllBtn"><svg class="i"><use href="#i-shuffle"/></svg>Shuffle</button>
        <input class="filter-input" id="libFilter" type="search" placeholder="Filter…" aria-label="Filter library">
      </div>
      <div class="status" id="libraryStatus" hidden></div>
      <ul class="list" id="libraryList"></ul>
    </section>

    <!-- Downloads -->
    <section class="view" id="view-downloads" hidden>
      <div class="view-head">
        <h2>Downloads</h2>
        <button class="btn ghost small" id="clearJobsBtn">Clear finished</button>
      </div>
      <div class="status" id="downloadsStatus" hidden></div>
      <ul class="list" id="downloadList"></ul>
    </section>

    <!-- Playlists -->
    <section class="view" id="view-playlists" hidden>
      <div class="view-head">
        <h2>Playlists</h2>
        <button class="btn soft small" id="newPlaylistBtn"><svg class="i"><use href="#i-plus"/></svg>New</button>
      </div>
      <ul class="list" id="playlistList"></ul>
    </section>
  </main>

  <!-- Mini player -->
  <div class="mini" id="mini" hidden>
    <div class="mini-progress"><span id="miniProgressBar"></span></div>
    <div class="mini-inner" id="miniExpand">
      <span class="cover cover-sm" id="miniCoverWrap">
        <img id="miniCover" alt="" decoding="async">
        <svg class="i placeholder"><use href="#i-music"/></svg>
      </span>
      <span class="mini-text">
        <span class="mini-title" id="miniTitle">Nothing playing</span>
        <span class="mini-sub" id="miniArtist"></span>
      </span>
      <span class="mini-controls">
        <button class="icon-btn" id="miniPlay" aria-label="Play or pause"><svg class="i"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="miniNext" aria-label="Next track"><svg class="i"><use href="#i-next"/></svg></button>
      </span>
    </div>
  </div>

  <!-- Tabs -->
  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="search"><svg class="i"><use href="#i-search"/></svg><span>Search</span></button>
    <button class="tab" data-tab="library"><svg class="i"><use href="#i-library"/></svg><span>Library</span></button>
    <button class="tab" data-tab="downloads"><svg class="i"><use href="#i-download"/></svg><span>Downloads</span><em class="tab-badge" id="downloadsBadge" hidden></em></button>
    <button class="tab" data-tab="playlists"><svg class="i"><use href="#i-list"/></svg><span>Playlists</span></button>
  </nav>
</div>

<!-- Now playing sheet -->
<div class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-label="Now playing">
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-panel">
    <header class="sheet-head">
      <button class="icon-btn" id="sheetClose" aria-label="Close"><svg class="i down"><use href="#i-chevron"/></svg></button>
      <div class="sheet-head-title"><span class="eyebrow">Now playing</span><strong id="sheetSource">—</strong></div>
      <button class="icon-btn" id="sheetQueueBtn" aria-label="Show queue"><svg class="i"><use href="#i-list"/></svg></button>
    </header>

    <div class="sheet-art" id="sheetArt">
      <img id="sheetCover" alt="" decoding="async">
      <svg class="i placeholder"><use href="#i-music"/></svg>
      <canvas id="visualizer" aria-hidden="true"></canvas>
    </div>

    <div class="sheet-meta">
      <h3 id="sheetTitle">—</h3>
      <p id="sheetArtist">—</p>
    </div>

    <div class="seek">
      <input type="range" id="seekBar" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="seek-times"><span id="seekCurrent">0:00</span><span id="seekTotal">0:00</span></div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn big" id="prevBtn" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="play-btn" id="playBtn" aria-label="Play or pause"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="icon-btn big" id="nextBtn" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="icon-btn" id="repeatBtn" aria-label="Repeat"><svg class="i"><use href="#i-repeat"/></svg></button>
    </div>

    <div class="extras">
      <div class="volume">
        <svg class="i"><use href="#i-volume"/></svg>
        <input type="range" id="volumeBar" min="0" max="100" value="100" aria-label="Volume">
      </div>
      <div class="extra-buttons">
        <button class="btn ghost small" id="offlineToggleBtn"><svg class="i"><use href="#i-download"/></svg><span id="offlineToggleLabel">Save offline</span></button>
        <button class="btn ghost small" id="playlistAddBtn"><svg class="i"><use href="#i-plus"/></svg>Playlist</button>
      </div>
    </div>

    <div class="queue" id="queuePanel" hidden>
      <div class="queue-head"><strong>Queue</strong><span id="queueCount"></span></div>
      <ul class="list" id="queueList"></ul>
    </div>
  </div>
</div>

<div class="menu" id="menu" hidden role="menu"></div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden></div>

<template id="trackTemplate">
  <li class="row track-row">
    <button class="row-main">
      <span class="cover">
        <img alt="" decoding="async">
        <svg class="i placeholder"><use href="#i-music"/></svg>
        <span class="playing-bars" hidden><i></i><i></i><i></i></span>
      </span>
      <span class="row-text">
        <span class="row-title"></span>
        <span class="row-sub"></span>
      </span>
    </button>
    <span class="row-meta"></span>
    <button class="icon-btn row-action" aria-label="More actions"></button>
  </li>
</template>

<template id="folderTemplate">
  <li class="row folder-row">
    <button class="row-main">
      <span class="cover"><svg class="i"><use href="#i-folder"/></svg></span>
      <span class="row-text"><span class="row-title"></span><span class="row-sub"></span></span>
    </button>
    <span class="row-meta"></span>
    <svg class="i chev"><use href="#i-chevron"/></svg>
  </li>
</template>

<template id="jobTemplate">
  <li class="job">
    <div class="job-head">
      <span class="cover cover-sm"><img alt="" decoding="async"><svg class="i placeholder"><use href="#i-music"/></svg></span>
      <div class="job-text">
        <span class="row-title"></span>
        <span class="row-sub"></span>
      </div>
      <div class="job-actions"></div>
    </div>
    <div class="job-bar"><span></span></div>
  </li>
</template>

<script type="module" src="/js/app.js"></script>
</body>
</html>
