name: Resonance
options:
  bundleIdPrefix: com.rnetis
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "5"
    # Language mode, not the toolchain version: keeps Xcode 15/16/26 happy.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    SWIFT_EMIT_LOC_STRINGS: NO
    CLANG_ENABLE_MODULES: YES

targets:
  Resonance:
    type: application
    platform: iOS
    sources:
      - path: Resonance
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: Resonance
        PRODUCT_BUNDLE_IDENTIFIER: com.rnetis.resonance
        INFOPLIST_FILE: Resonance/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES

schemes:
  Resonance:
    build:
      targets:
        Resonance: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
